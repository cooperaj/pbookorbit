<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-label="Book rows, group rows and the book info page draw a Cover; author rows and the author info page draw an AuthorPortrait. Both draw a CoversImage, which asks Covers for a file URL. Covers::fetch returns nothing until laid out, resolves a missing or replaced version to the downloaded one, returns a cached size, makes a size from a cached download, offline makes a copy from another version, and online queues a download. BookOrbitClient::download fetches the thumbnail, Covers::save keeps it and deletes other versions, and ready(id, photo) makes every CoversImage of that id ask again. Files live in pbookorbit-covers in 256 folders named from a hash of the cover's name.">
  <style>
    svg { font-family: "IBM Plex Mono", ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
    text { font-size: 12px; }
    .name { font-size: 13px; font-weight: 500; }
    .muted { font-size: 11px; }
    .box, .hollow, .line { stroke-width: 1.2; }
    .chip { stroke-width: 1; }
    .frame, .line { fill: none; }
    .frame, .key { stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    svg { color: #1b1d1c; }
    .bg { fill: #ffffff; }
    text { fill: #1b1d1c; }
    .muted { fill: #5d625f; }
    .accent-text { fill: #00796b; }
    .box { fill: #ffffff; stroke: #1b1d1c; }
    .chip { fill: #f1f3f0; stroke: #c9cec9; }
    .frame { stroke: #00796b; }
    .key { fill: #ffffff; stroke: #00796b; }
    .band { fill: #f1f3f0; }
    .line { stroke: #1b1d1c; }
    .head { fill: #1b1d1c; }
    .hollow { fill: #ffffff; stroke: #1b1d1c; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e8e5; }
      .bg { fill: #1f2221; }
      text { fill: #e6e8e5; }
      .muted { fill: #a3a9a5; }
      .accent-text { fill: #4db6a6; }
      .box { fill: #1f2221; stroke: #e6e8e5; }
      .chip { fill: #161817; stroke: #3d423f; }
      .frame { stroke: #4db6a6; }
      .key { fill: #1f2221; stroke: #4db6a6; }
      .band { fill: #161817; }
      .line { stroke: #e6e8e5; }
      .head { fill: #e6e8e5; }
      .hollow { fill: #1f2221; stroke: #e6e8e5; }
    }
  </style>
  <rect class="bg" width="960" height="860"/>
  <defs>
    <marker id="h-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="head" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <!-- Who asks -->
  <rect class="frame" x="20" y="16" width="920" height="120" rx="6"/>
  <text class="name accent-text" x="36" y="40">Who asks</text>
  <text class="muted" x="112" y="40">every image goes through one of two components</text>

  <rect class="box" x="36" y="52" width="168" height="68" rx="4"/>
  <text class="name" x="48" y="73">BookRow</text>
  <text class="muted" x="48" y="92">library, books-of,</text>
  <text class="muted" x="48" y="107">search results</text>
  <rect class="box" x="216" y="52" width="168" height="68" rx="4"/>
  <text class="name" x="228" y="73">GroupRow</text>
  <text class="muted" x="228" y="92">collections, series:</text>
  <text class="muted" x="228" y="107">two Covers</text>
  <rect class="box" x="396" y="52" width="168" height="68" rx="4"/>
  <text class="name" x="408" y="73">BookInfoPage</text>
  <text class="muted" x="408" y="92">large Cover, made</text>
  <text class="muted" x="408" y="107">before it draws</text>
  <rect class="box" x="576" y="52" width="168" height="68" rx="4"/>
  <text class="name" x="588" y="73">GroupRow</text>
  <text class="muted" x="588" y="92">authors tab</text>
  <rect class="box" x="756" y="52" width="168" height="68" rx="4"/>
  <text class="name" x="768" y="73">AuthorInfoPage</text>
  <text class="muted" x="768" y="92">the author's photo</text>

  <!-- The two components -->
  <line class="line" x1="120" y1="120" x2="220" y2="168" marker-end="url(#h-arrow)"/>
  <line class="line" x1="300" y1="120" x2="270" y2="168" marker-end="url(#h-arrow)"/>
  <line class="line" x1="480" y1="120" x2="370" y2="168" marker-end="url(#h-arrow)"/>
  <line class="line" x1="660" y1="120" x2="680" y2="168" marker-end="url(#h-arrow)"/>
  <line class="line" x1="840" y1="120" x2="780" y2="168" marker-end="url(#h-arrow)"/>

  <rect class="box" x="120" y="170" width="300" height="52" rx="4"/>
  <text class="name" x="132" y="191">Cover</text>
  <text class="muted" x="132" y="210">{id, coverVersion}; series give no version</text>
  <rect class="box" x="580" y="170" width="300" height="52" rx="4"/>
  <text class="name" x="592" y="191">AuthorPortrait</text>
  <text class="muted" x="592" y="210">{id, imageUrl}, or initials if none</text>

  <line class="line" x1="270" y1="222" x2="400" y2="260" marker-end="url(#h-arrow)"/>
  <line class="line" x1="730" y1="222" x2="560" y2="260" marker-end="url(#h-arrow)"/>

  <rect class="key" x="260" y="262" width="440" height="84" rx="4"/>
  <text class="name" x="272" y="282">CoversImage</text>
  <text x="272" y="300">url: covers.source(id, version, w, h)</text>
  <text x="272" y="316">  or covers.authorPhoto(id, imageUrl, w, h)</text>
  <text class="muted" x="272" y="334">"" shows the placeholder · night mode: inverted copy</text>

  <!-- Covers::fetch -->
  <line class="line" x1="400" y1="346" x2="300" y2="374" marker-end="url(#h-arrow)"/>
  <rect class="frame" x="20" y="376" width="560" height="374" rx="6"/>
  <text class="name accent-text" x="36" y="400">Covers::fetch()</text>
  <text class="muted" x="166" y="400">the first that applies</text>

  <rect class="chip" x="36" y="414" width="528" height="46" rx="3"/>
  <text x="46" y="433">1 not laid out yet → ""</text>
  <text class="muted" x="62" y="450">asked again once it has a size</text>
  <rect class="chip" x="36" y="468" width="528" height="46" rx="3"/>
  <text x="46" y="487">2 no version, or one replaced this session</text>
  <text class="muted" x="62" y="504">→ use whichever version is downloaded</text>
  <rect class="chip" x="36" y="522" width="528" height="46" rx="3"/>
  <text x="46" y="541">3 this size is cached → its file URL</text>
  <text class="muted" x="62" y="558">&lt;name&gt;-&lt;version&gt;-&lt;w&gt;x&lt;h&gt;.png</text>
  <rect class="chip" x="36" y="576" width="528" height="46" rx="3"/>
  <text x="46" y="595">4 the download is cached → make this size</text>
  <text class="muted" x="62" y="612">scale (crop photos), adjust for e-ink, save PNG</text>
  <rect class="chip" x="36" y="630" width="528" height="46" rx="3"/>
  <text x="46" y="649">5 offline → another version's copy, or ""</text>
  <text class="muted" x="62" y="666">noted, so ready() follows once back online</text>
  <rect class="chip" x="36" y="684" width="528" height="46" rx="3"/>
  <text x="46" y="703">6 online → queue the download, ""</text>
  <text class="muted" x="62" y="720">newest first, 3 at once, one per version</text>

  <!-- The download -->
  <path class="line" d="M564,707 L598,707 L598,414 L618,414" marker-end="url(#h-arrow)"/>
  <rect class="box" x="620" y="376" width="320" height="76" rx="4"/>
  <text class="name" x="632" y="397">BookOrbitClient::download()</text>
  <text class="muted" x="632" y="418">GET /books/:id/thumbnail</text>
  <text class="muted" x="632" y="436">GET /authors/:id/thumbnail</text>

  <line class="line" x1="780" y1="452" x2="780" y2="482" marker-end="url(#h-arrow)"/>
  <rect class="box" x="620" y="484" width="320" height="120" rx="4"/>
  <text class="name" x="632" y="505">Covers::save()</text>
  <text class="muted" x="632" y="524">not an image: logged, dropped</text>
  <text class="muted" x="632" y="540">no version, and one with a version</text>
  <text class="muted" x="632" y="556">is there: that one is kept</text>
  <text class="muted" x="632" y="572">else saved, other versions deleted</text>
  <text class="muted" x="632" y="588">and noted as replaced (step 2)</text>

  <line class="line" x1="780" y1="604" x2="780" y2="634" marker-end="url(#h-arrow)"/>
  <rect class="key" x="620" y="636" width="320" height="56" rx="4"/>
  <text class="name" x="632" y="657">emit ready(id, photo)</text>
  <text class="muted" x="632" y="676">and for offline misses, once online</text>

  <!-- Asked again -->
  <path class="line dash" d="M940,664 L950,664 L950,304 L702,304" marker-end="url(#h-arrow)"/>
  <text class="muted" x="944" y="296" text-anchor="end">every image of that id asks again</text>

  <!-- On disk -->
  <rect class="frame" x="20" y="780" width="920" height="64" rx="6"/>
  <text class="name accent-text" x="36" y="801">pbookorbit-covers/</text>
  <text class="muted" x="190" y="801">in /mnt/ext1/system/cache · one version kept per name</text>
  <rect class="chip" x="36" y="810" width="190" height="24" rx="3"/>
  <text x="46" y="827">cd/ from hash(name)</text>
  <rect class="chip" x="238" y="810" width="220" height="24" rx="3"/>
  <text x="248" y="827">290-&lt;version&gt;-source</text>
  <rect class="chip" x="470" y="810" width="250" height="24" rx="3"/>
  <text x="480" y="827">290-&lt;version&gt;-94x141.png</text>
  <rect class="chip" x="732" y="810" width="192" height="24" rx="3"/>
  <text x="742" y="827">author-7-&lt;version&gt;-…</text>

  <line class="line dash" x1="300" y1="750" x2="300" y2="778" marker-end="url(#h-arrow)"/>
  <text class="muted" x="310" y="769">reads, makes sizes</text>
  <path class="line dash" d="M620,560 L606,560 L606,778" marker-end="url(#h-arrow)"/>
  <text class="muted" x="614" y="769">writes, deletes</text>
</svg>
