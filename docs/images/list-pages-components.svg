<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="ListPage is the frame, containing a ListView, scrollbar, jump rail, page buttons, spinner and empty state, and reading its labels from a ListQuery. BookListPage and GroupListPage extend it with BookRow and GroupRow. BooksOfPage and SearchPage each contain a BookListPage, and AuthorSeriesPage a GroupListPage.">
  <style>
    svg { font-family: "IBM Plex Mono", ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
    text { font-size: 12px; }
    .name { font-size: 13px; font-weight: 500; }
    .muted { font-size: 11px; }
    .box, .hollow, .line { stroke-width: 1.2; }
    .chip { stroke-width: 1; }
    .frame, .line { fill: none; }
    .frame, .key { stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    svg { color: #1b1d1c; }
    .bg { fill: #ffffff; }
    text { fill: #1b1d1c; }
    .muted { fill: #5d625f; }
    .accent-text { fill: #00796b; }
    .box { fill: #ffffff; stroke: #1b1d1c; }
    .chip { fill: #f1f3f0; stroke: #c9cec9; }
    .frame { stroke: #00796b; }
    .key { fill: #ffffff; stroke: #00796b; }
    .band { fill: #f1f3f0; }
    .line { stroke: #1b1d1c; }
    .head { fill: #1b1d1c; }
    .hollow { fill: #ffffff; stroke: #1b1d1c; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e8e5; }
      .bg { fill: #1f2221; }
      text { fill: #e6e8e5; }
      .muted { fill: #a3a9a5; }
      .accent-text { fill: #4db6a6; }
      .box { fill: #1f2221; stroke: #e6e8e5; }
      .chip { fill: #161817; stroke: #3d423f; }
      .frame { stroke: #4db6a6; }
      .key { fill: #1f2221; stroke: #4db6a6; }
      .band { fill: #161817; }
      .line { stroke: #e6e8e5; }
      .head { fill: #e6e8e5; }
      .hollow { fill: #1f2221; stroke: #e6e8e5; }
    }
  </style>
  <rect class="bg" width="960" height="600"/>
  <defs>
    <marker id="h-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="head" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="h-extends" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path class="hollow" d="M1,1 L13,7 L1,13 z"/>
    </marker>
  </defs>

  <!-- ListPage, the frame -->
  <rect class="frame" x="170" y="16" width="620" height="200" rx="6"/>
  <text class="name accent-text" x="186" y="40">ListPage</text>
  <text class="muted" x="262" y="40">the frame every list page shares</text>

  <rect class="box" x="186" y="56" width="270" height="144" rx="4"/>
  <text class="name" x="198" y="77">ListView</text>
  <rect class="chip" x="198" y="88" width="246" height="28" rx="3"/>
  <text x="208" y="106">header: SubToolbar, if a query</text>
  <rect class="chip" x="198" y="122" width="246" height="28" rx="3"/>
  <text x="208" y="140">header: error line</text>
  <rect class="chip" x="198" y="156" width="246" height="28" rx="3"/>
  <text x="208" y="174">rows: the delegate</text>

  <rect class="box" x="472" y="56" width="144" height="30" rx="4"/>
  <text x="544" y="75" text-anchor="middle">ListScrollbar</text>
  <rect class="box" x="632" y="56" width="144" height="30" rx="4"/>
  <text x="704" y="75" text-anchor="middle">JumpRail</text>
  <rect class="box" x="472" y="96" width="144" height="30" rx="4"/>
  <text x="544" y="115" text-anchor="middle">PageButtons</text>
  <rect class="box" x="632" y="96" width="144" height="30" rx="4"/>
  <text x="704" y="115" text-anchor="middle">Spinner</text>
  <rect class="box" x="472" y="136" width="144" height="30" rx="4"/>
  <text x="544" y="155" text-anchor="middle">EmptyState</text>
  <text class="muted" x="472" y="190">signals: rowsWanted, sort and filter taps</text>

  <!-- ListQuery -->
  <line class="line" x1="790" y1="103" x2="836" y2="103" marker-end="url(#h-arrow)"/>
  <text class="muted" x="813" y="96" text-anchor="middle">query</text>
  <rect class="box" x="838" y="86" width="110" height="34" rx="4"/>
  <text x="893" y="107" text-anchor="middle">ListQuery</text>
  <text class="muted" x="893" y="138" text-anchor="middle">sort, filter labels</text>

  <!-- The two kinds of list -->
  <rect class="box" x="170" y="290" width="280" height="56" rx="4"/>
  <text class="name" x="186" y="313">BookListPage</text>
  <text class="muted" x="186" y="333">bookClicked · bookHeld</text>
  <rect class="box" x="510" y="290" width="280" height="56" rx="4"/>
  <text class="name" x="526" y="313">GroupListPage</text>
  <text class="muted" x="526" y="333">loaded · noneTitle · groupClicked</text>

  <line class="line" x1="310" y1="290" x2="310" y2="218" marker-end="url(#h-extends)"/>
  <text class="muted" x="320" y="258">extends</text>
  <line class="line" x1="650" y1="290" x2="650" y2="218" marker-end="url(#h-extends)"/>
  <text class="muted" x="660" y="258">extends</text>

  <!-- Their rows -->
  <line class="line" x1="170" y1="318" x2="132" y2="318" marker-end="url(#h-arrow)"/>
  <text class="muted" x="151" y="310" text-anchor="middle">row</text>
  <rect class="box" x="20" y="300" width="110" height="36" rx="4"/>
  <text x="75" y="322" text-anchor="middle">BookRow</text>
  <line class="line" x1="790" y1="318" x2="828" y2="318" marker-end="url(#h-arrow)"/>
  <text class="muted" x="809" y="310" text-anchor="middle">row</text>
  <rect class="box" x="830" y="300" width="110" height="36" rx="4"/>
  <text x="885" y="322" text-anchor="middle">GroupRow</text>

  <!-- Pages that contain a list -->
  <rect class="box" x="20" y="420" width="290" height="160" rx="4"/>
  <text class="name" x="36" y="444">BooksOfPage</text>
  <rect class="chip" x="36" y="458" width="258" height="30" rx="3"/>
  <text x="46" y="477">PageHeader: "Author / name"</text>
  <rect class="chip" x="36" y="496" width="258" height="30" rx="3"/>
  <text class="accent-text" x="46" y="515">BookListPage</text>
  <text class="muted" x="36" y="556">an author's, series' or</text>
  <text class="muted" x="36" y="571">collection's books</text>

  <rect class="box" x="326" y="420" width="310" height="160" rx="4"/>
  <text class="name" x="342" y="444">SearchPage</text>
  <rect class="chip" x="342" y="458" width="278" height="30" rx="3"/>
  <text x="352" y="477">search box, its spinner</text>
  <rect class="chip" x="342" y="496" width="278" height="30" rx="3"/>
  <text x="352" y="515">recent searches: ListView</text>
  <rect class="chip" x="342" y="534" width="278" height="30" rx="3"/>
  <text x="352" y="553">results: <tspan class="accent-text">BookListPage</tspan></text>

  <rect class="box" x="652" y="420" width="290" height="160" rx="4"/>
  <text class="name" x="668" y="444">AuthorSeriesPage</text>
  <rect class="chip" x="668" y="458" width="258" height="30" rx="3"/>
  <text x="678" y="477">PageHeader: "Series / name"</text>
  <rect class="chip" x="668" y="496" width="258" height="30" rx="3"/>
  <text class="accent-text" x="678" y="515">GroupListPage</text>
  <text class="muted" x="668" y="556">an author's series</text>

  <line class="line dash" x1="165" y1="420" x2="230" y2="348" marker-end="url(#h-arrow)"/>
  <text class="muted" x="200" y="392">contains one</text>
  <line class="line dash" x1="480" y1="420" x2="400" y2="348" marker-end="url(#h-arrow)"/>
  <text class="muted" x="456" y="392">contains one</text>
  <line class="line dash" x1="797" y1="420" x2="700" y2="348" marker-end="url(#h-arrow)"/>
  <text class="muted" x="766" y="392">contains one</text>
</svg>
