<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="ListPage is the frame: an optional PageHeader, a ListView with the sub-toolbar and error line as its header, a scrollbar, jump rail, page buttons, spinner, empty state and A2 scrolling. It is given a ListQuery, the shared ListMenus and the shared RailLayout. BookListPage and GroupListPage extend it with BookRow and GroupRow, which both extend ListRow and draw their pictures with Cover. BooksOfPage extends BookListPage and AuthorSeriesPage extends GroupListPage, each adding a title and model; SearchPage contains a BookListPage for its results.">
  <style>
    svg { font-family: "IBM Plex Mono", ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
    text { font-size: 12px; }
    .name { font-size: 13px; font-weight: 500; }
    .muted { font-size: 11px; }
    .box, .hollow, .line { stroke-width: 1.2; }
    .chip { stroke-width: 1; }
    .frame, .line { fill: none; }
    .frame, .key { stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    svg { color: #1b1d1c; }
    .bg { fill: #ffffff; }
    text { fill: #1b1d1c; }
    .muted { fill: #5d625f; }
    .accent-text { fill: #00796b; }
    .box { fill: #ffffff; stroke: #1b1d1c; }
    .chip { fill: #f1f3f0; stroke: #c9cec9; }
    .frame { stroke: #00796b; }
    .key { fill: #ffffff; stroke: #00796b; }
    .band { fill: #f1f3f0; }
    .line { stroke: #1b1d1c; }
    .head { fill: #1b1d1c; }
    .hollow { fill: #ffffff; stroke: #1b1d1c; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e8e5; }
      .bg { fill: #1f2221; }
      text { fill: #e6e8e5; }
      .muted { fill: #a3a9a5; }
      .accent-text { fill: #4db6a6; }
      .box { fill: #1f2221; stroke: #e6e8e5; }
      .chip { fill: #161817; stroke: #3d423f; }
      .frame { stroke: #4db6a6; }
      .key { fill: #1f2221; stroke: #4db6a6; }
      .band { fill: #161817; }
      .line { stroke: #e6e8e5; }
      .head { fill: #e6e8e5; }
      .hollow { fill: #1f2221; stroke: #e6e8e5; }
    }
  </style>
  <rect class="bg" width="960" height="640"/>
  <defs>
    <marker id="h-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="head" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="h-extends" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path class="hollow" d="M1,1 L13,7 L1,13 z"/>
    </marker>
  </defs>

  <!-- ListPage, the frame -->
  <rect class="frame" x="20" y="16" width="710" height="230" rx="6"/>
  <text class="name accent-text" x="36" y="40">ListPage</text>
  <text class="muted" x="112" y="40">the frame every list page shares</text>

  <rect class="box" x="36" y="56" width="320" height="30" rx="4"/>
  <text x="48" y="75">PageHeader, if a title</text>

  <rect class="box" x="36" y="96" width="320" height="134" rx="4"/>
  <text class="name" x="48" y="117">ListView</text>
  <rect class="chip" x="48" y="128" width="296" height="28" rx="3"/>
  <text x="58" y="146">header: SubToolbar, if a query</text>
  <rect class="chip" x="48" y="162" width="296" height="28" rx="3"/>
  <text x="58" y="180">header: error line</text>
  <rect class="chip" x="48" y="196" width="296" height="28" rx="3"/>
  <text x="58" y="214">rows: the delegate</text>

  <rect class="box" x="372" y="56" width="164" height="30" rx="4"/>
  <text x="454" y="75" text-anchor="middle">ListScrollbar</text>
  <rect class="box" x="552" y="56" width="164" height="30" rx="4"/>
  <text x="634" y="75" text-anchor="middle">JumpRail</text>
  <rect class="box" x="372" y="96" width="164" height="30" rx="4"/>
  <text x="454" y="115" text-anchor="middle">PageButtons</text>
  <rect class="box" x="552" y="96" width="164" height="30" rx="4"/>
  <text x="634" y="115" text-anchor="middle">Spinner</text>
  <rect class="box" x="372" y="136" width="164" height="30" rx="4"/>
  <text x="454" y="155" text-anchor="middle">EmptyState</text>
  <rect class="box" x="552" y="136" width="164" height="30" rx="4"/>
  <text x="634" y="155" text-anchor="middle">A2Scrolling</text>
  <text class="muted" x="372" y="200">signals: rowsWanted, scrollStarted, back</text>
  <text class="muted" x="372" y="216">sub-toolbar taps go to its menus</text>

  <!-- What it's given -->
  <line class="line" x1="730" y1="60" x2="778" y2="60" marker-end="url(#h-arrow)"/>
  <rect class="box" x="780" y="38" width="160" height="46" rx="4"/>
  <text x="792" y="57">ListQuery</text>
  <text class="muted" x="792" y="74">query: sort, filter</text>
  <line class="line" x1="730" y1="130" x2="778" y2="130" marker-end="url(#h-arrow)"/>
  <rect class="box" x="780" y="108" width="160" height="46" rx="4"/>
  <text x="792" y="127">ListMenus</text>
  <text class="muted" x="792" y="144">menus: one, shared</text>
  <line class="line" x1="730" y1="200" x2="778" y2="200" marker-end="url(#h-arrow)"/>
  <rect class="box" x="780" y="178" width="160" height="46" rx="4"/>
  <text x="792" y="197">RailLayout</text>
  <text class="muted" x="792" y="214">railLayout: shared</text>

  <!-- The two kinds of list -->
  <rect class="box" x="20" y="290" width="240" height="56" rx="4"/>
  <text class="name" x="36" y="313">BookListPage</text>
  <text class="muted" x="36" y="333">bookClicked · bookHeld</text>
  <rect class="box" x="690" y="290" width="250" height="56" rx="4"/>
  <text class="name" x="706" y="313">GroupListPage</text>
  <text class="muted" x="706" y="333">loaded · groupClicked</text>

  <line class="line" x1="140" y1="290" x2="140" y2="248" marker-end="url(#h-extends)"/>
  <text class="muted" x="150" y="274">extends</text>
  <line class="line" x1="710" y1="290" x2="710" y2="248" marker-end="url(#h-extends)"/>
  <text class="muted" x="720" y="274">extends</text>

  <!-- Their rows, on one row layout -->
  <line class="line" x1="260" y1="318" x2="298" y2="318" marker-end="url(#h-arrow)"/>
  <text class="muted" x="279" y="310" text-anchor="middle">row</text>
  <rect class="box" x="300" y="292" width="160" height="52" rx="4"/>
  <text x="312" y="313">BookRow</text>
  <text class="muted" x="312" y="332">picture: Cover</text>
  <line class="line" x1="690" y1="318" x2="662" y2="318" marker-end="url(#h-arrow)"/>
  <text class="muted" x="676" y="310" text-anchor="middle">row</text>
  <rect class="box" x="500" y="292" width="160" height="52" rx="4"/>
  <text x="512" y="313">GroupRow</text>
  <text class="muted" x="512" y="332">Covers or portrait</text>

  <line class="line" x1="400" y1="344" x2="400" y2="398" marker-end="url(#h-extends)"/>
  <text class="muted" x="410" y="376">extends</text>
  <line class="line" x1="580" y1="344" x2="580" y2="398" marker-end="url(#h-extends)"/>
  <text class="muted" x="590" y="376">extends</text>
  <rect class="box" x="340" y="400" width="300" height="52" rx="4"/>
  <text class="name" x="352" y="421">ListRow</text>
  <text class="muted" x="352" y="440">picture, three lines, section box</text>

  <!-- Pages built on a list -->
  <rect class="box" x="20" y="490" width="290" height="130" rx="4"/>
  <text class="name" x="36" y="514">BooksOfPage</text>
  <rect class="chip" x="36" y="526" width="258" height="28" rx="3"/>
  <text x="46" y="544">title: "Author / name"</text>
  <rect class="chip" x="36" y="560" width="258" height="28" rx="3"/>
  <text x="46" y="578">model: booksOf</text>
  <text class="muted" x="36" y="608">books of an author, series, collection</text>

  <rect class="box" x="330" y="490" width="310" height="130" rx="4"/>
  <text class="name" x="346" y="514">SearchPage</text>
  <rect class="chip" x="346" y="526" width="278" height="26" rx="3"/>
  <text x="356" y="543">search box, its spinner</text>
  <rect class="chip" x="346" y="556" width="278" height="26" rx="3"/>
  <text x="356" y="573">recent searches: ListView</text>
  <rect class="chip" x="346" y="586" width="278" height="26" rx="3"/>
  <text x="356" y="603">results: <tspan class="accent-text">BookListPage</tspan></text>

  <rect class="box" x="660" y="490" width="280" height="130" rx="4"/>
  <text class="name" x="676" y="514">AuthorSeriesPage</text>
  <rect class="chip" x="676" y="526" width="248" height="28" rx="3"/>
  <text x="686" y="544">title: "Series / name"</text>
  <rect class="chip" x="676" y="560" width="248" height="28" rx="3"/>
  <text x="686" y="578">model: authorSeriesList</text>
  <text class="muted" x="676" y="608">an author's series</text>

  <line class="line" x1="140" y1="490" x2="140" y2="348" marker-end="url(#h-extends)"/>
  <text class="muted" x="150" y="420">extends</text>
  <line class="line" x1="800" y1="490" x2="800" y2="348" marker-end="url(#h-extends)"/>
  <text class="muted" x="810" y="420">extends</text>
  <line class="line dash" x1="345" y1="490" x2="250" y2="348" marker-end="url(#h-arrow)"/>
  <text class="muted" x="292" y="446" text-anchor="end">contains one</text>
</svg>
